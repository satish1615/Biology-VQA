[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biovqa-ai"
version = "0.1.0"
description = "Image-grounded biology visual question answering and evaluation workbench"
requires-python = ">=3.10"
dependencies = ["streamlit>=1.36,<2", "pandas>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
